services:
  ecoli-twin:
    build: .
    image: ecoli-twin:vertical-slice
    ports: ["8080:8080"]
    environment:
      ECOLI_ADDR: ":8080"
      ECOLI_ROOT: "/app"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
