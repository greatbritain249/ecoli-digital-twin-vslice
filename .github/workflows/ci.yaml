name: Validate vertical slice
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make generate
      - run: make test
      - run: node --check apps/web/app.js
      - name: Ensure generated scene remains committed and deterministic
        run: git diff --exit-code -- data/scene.json data/replay-example.json
